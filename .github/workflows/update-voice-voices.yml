name: Generate voice languages data

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Home Assistant Core stage to generate data from"
        type: choice
        default: stable
        options:
          - stable
          - beta
  schedule:
    - cron: '0 06 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Generate data
        env:
          GITHUB_GENERATOR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage || 'stable' }}
        run: npm run generate:voice-languages -- "$STAGE"

      - name: Upload data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voiceLanguages
          path: |
            ./_data/sttLanguages.json
            ./_data/sttV2Languages.json
            ./_data/ttsLanguages.json
          if-no-files-found: error
          retention-days: 1

  create-pr:
    name: Create PR
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: generate
    permissions:
      contents: write # To push the branch with the updated data
      pull-requests: write # To open the pull request
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "voiceLanguages"
          path: "./_data/"

      - name: Create PR
        id: pr
        # zizmor: ignore[superfluous-actions]
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update voice languages data"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          sign-commits: true
          title: "Update voice languages data"
          body: |
            This PR was automatically generated by the workflow.
            It updates the voice languages data.
          base: main
          branch: update-voice-languages-data
          add-paths: |
            _data/ttsLanguages.json
            _data/sttLanguages.json
            _data/sttV2Languages.json